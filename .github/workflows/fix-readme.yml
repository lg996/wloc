name: Fix-README

# 一次性工作流：把 README 的订阅地址/源码入口从上游改为本仓库，完成后自动移除自身。
on:
  push:
    paths:
      - '.github/workflows/fix-readme.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rewrite README links to this repository
        run: |
          set -euo pipefail
          before=$(grep -c 'xepes0/wloc' README.md || true)
          echo "[*] occurrences of 'xepes0/wloc' before: $before"
          sed -i 's#xepes0/wloc#lg996/wloc#g' README.md
          sed -i 's#^选点页面：\[https://wloc\.xepesw\.workers\.dev/\](https://wloc\.xepesw\.workers\.dev/)。$#选点页面：尚未配置公共实例，请按下方说明自行部署。#' README.md
          after=$(grep -c 'xepes0/wloc' README.md || true)
          echo "[*] occurrences after: $after"
          test "$after" = "0"
          echo '[+] revised lines:'
          grep -n 'lg996/wloc' README.md | head -12

      - name: Commit change and remove this one-off workflow
        run: |
          set -euo pipefail
          git config user.name 'lg996'
          git config user.email '97672957+lg996@users.noreply.github.com'
          git rm -q .github/workflows/fix-readme.yml
          git add README.md
          git diff --staged --quiet || (git commit -m 'docs: README 订阅地址与源码入口指向自建实例' && git push)
