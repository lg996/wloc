name: Configure-Apply

# 一次性工作流：按 project.config.json 重新生成模块与文档，完成后自动移除自身。
on:
  push:
    paths:
      - '.github/workflows/configure-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate modules and docs
        run: |
          set -euo pipefail
          node scripts/configure.mjs
          node scripts/check.mjs --release
          echo '[+] changed files:'
          git status --short

      - name: Commit and remove this one-off workflow
        run: |
          set -euo pipefail
          git config user.name 'lg996'
          git config user.email '97672957+lg996@users.noreply.github.com'
          git rm -q .github/workflows/configure-apply.yml
          git add -A
          git diff --staged --quiet || (git commit -m 'chore: 回填自建 Worker 站点地址并重新生成模块' && git push)
